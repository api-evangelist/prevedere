openapi: 3.2.0
info:
  title: Board Foresight API - V1 Indicator API
  description: ''
  version: v1
security:
- api key: []
tags:
- name: Indicator
  description: ''
paths:
  /indicator/composite/definition/{Provider}/{ProviderId}:
    get:
      tags:
      - Indicator
      summary: Retrieves the definition of a composite indicator
      description: Retrieves the definition for a given composite indicator in the system
      parameters:
      - name: Provider
        in: path
        description: Unique Identifier for Provider
        required: true
        schema:
          type: string
      - name: ProviderId
        in: path
        description: Identifier for specific indicator
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CompositeDefinition'
            application/json:
              schema:
                $ref: '#/components/schemas/CompositeDefinition'
            text/json:
              schema:
                $ref: '#/components/schemas/CompositeDefinition'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseMessage'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseMessage'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseMessage'
        '429':
          description: If the user has sent too many requests
      operationId: getIndicatorCompositeDefinitionByProviderByProviderId
      x-operation-id-source: derived
    put:
      tags:
      - Indicator
      summary: Updates the definition of a composite indicator
      description: updates the definition for a given composite indicator in the system
      parameters:
      - name: Provider
        in: path
        description: Unique Identifier for Provider
        required: true
        schema:
          type: string
      - name: ProviderId
        in: path
        description: Identifier for specific indicator
        required: true
        schema:
          type: string
      requestBody:
        description: Composite indicator definition
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/CompositeDefinitionUpdateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/CompositeDefinitionUpdateRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CompositeDefinitionUpdateRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CompositeDefinitionUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CompositeDefinitionUpdateResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/CompositeDefinitionUpdateResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/CompositeDefinitionUpdateResponse'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResponseMessage'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResponseMessage'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResponseMessage'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResponseMessage'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResponseMessage'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResponseMessage'
        '429':
          description: If the user has sent too many requests
      operationId: putIndicatorCompositeDefinitionByProviderByProviderId
      x-operation-id-source: derived
  /indicator/composite/definition:
    post:
      tags:
      - Indicator
      summary: Creates a composite indicator
      description: creates a composite indicator
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/CompositeDefinitionCreateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/CompositeDefinitionCreateRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CompositeDefinitionCreateRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CompositeDefinitionCreateRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CompositeDefinition'
            application/json:
              schema:
                $ref: '#/components/schemas/CompositeDefinition'
            text/json:
              schema:
                $ref: '#/components/schemas/CompositeDefinition'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResponseMessage'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResponseMessage'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResponseMessage'
        '429':
          description: If the user has sent too many requests
      operationId: postIndicatorCompositeDefinition
      x-operation-id-source: derived
  /indicator/{Provider}/{ProviderId}:
    get:
      tags:
      - Indicator
      description: Retrieves metadata for a given indicator in the system
      parameters:
      - name: Provider
        in: path
        required: true
        schema:
          type: string
      - name: ProviderId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Indicator'
            application/json:
              schema:
                $ref: '#/components/schemas/Indicator'
            text/json:
              schema:
                $ref: '#/components/schemas/Indicator'
        '429':
          description: If the user has sent too many requests
      summary: Get indicator by provider by provider id
      x-summary-source: derived
      operationId: getIndicatorByProviderByProviderId
      x-operation-id-source: derived
  /indicator/series/{Provider}/{ProviderId}:
    get:
      tags:
      - Indicator
      description: Retrieves time-series data for a given indicator in the system
      parameters:
      - name: Provider
        in: path
        required: true
        schema:
          type: string
      - name: ProviderId
        in: path
        required: true
        schema:
          type: string
      - name: Calculation
        in: query
        schema:
          type: string
      - name: Frequency
        in: query
        schema:
          type: string
      - name: StartDate
        in: query
        schema:
          type: string
      - name: EndDate
        in: query
        schema:
          type: string
      - name: Offset
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Point'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Point'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Point'
        '429':
          description: If the user has sent too many requests
      summary: Get indicator series by provider by provider id
      x-summary-source: derived
      operationId: getIndicatorSeriesByProviderByProviderId
      x-operation-id-source: derived
  /indicator/series/transform:
    post:
      tags:
      - Indicator
      description: Retrieves time-series data for a given indicator in the system with transformations applied
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/IndicatorTransformation'
          application/json:
            schema:
              $ref: '#/components/schemas/IndicatorTransformation'
          text/json:
            schema:
              $ref: '#/components/schemas/IndicatorTransformation'
          application/*+json:
            schema:
              $ref: '#/components/schemas/IndicatorTransformation'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Point'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Point'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Point'
        '429':
          description: If the user has sent too many requests
      summary: Create indicator series transform
      x-summary-source: derived
      operationId: postIndicatorSeriesTransform
      x-operation-id-source: derived
  /correlation/{FixedProvider}/{FixedProviderId}/{LeadingProvider}/{LeadingProviderId}/{Frequency}/{Calculation}:
    get:
      tags:
      - Indicator
      description: Generates correlation data by comparing two indicators
      parameters:
      - name: FixedProvider
        in: path
        required: true
        schema:
          type: string
      - name: FixedProviderId
        in: path
        required: true
        schema:
          type: string
      - name: LeadingProvider
        in: path
        required: true
        schema:
          type: string
      - name: LeadingProviderId
        in: path
        required: true
        schema:
          type: string
      - name: Frequency
        in: path
        required: true
        schema:
          type: string
      - name: Calculation
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CorrelationSet'
            application/json:
              schema:
                $ref: '#/components/schemas/CorrelationSet'
            text/json:
              schema:
                $ref: '#/components/schemas/CorrelationSet'
        '429':
          description: If the user has sent too many requests
      summary: Get correlation by fixed provider by fixed provider id by leading provider by…
      x-summary-source: derived
      operationId: getCorrelationByFixedProviderByFixedProviderIdByLeadingProviderByLeadingProviderIdByFrequencyByCalculation
      x-operation-id-source: derived
  /search:
    get:
      tags:
      - Indicator
      description: retrieves indicators based on search criteria
      parameters:
      - name: Frequency
        in: query
        description: A frequency value to filter search results by. <seealso cref="T:Prevedere.Analytics.Domain.Enum.Frequency" />
        schema:
          type: string
      - name: Calculation
        in: query
        description: A calculation value to filter search results by. <seealso cref="T:Prevedere.Analytics.Domain.Enum.Calculation" />
        schema:
          type: string
      - name: Seasonality
        in: query
        description: A seasonality value to filter search results by. <seealso cref="T:Prevedere.Analytics.Domain.Enum.Seasonality" />
        schema:
          type: string
      - name: Internal
        in: query
        description: A flag for returning internal company data sets
        schema:
          type: boolean
      - name: IncludeForecasted
        in: query
        description: A flag for returning forecasted indicators in the search results.
        schema:
          type: boolean
      - name: Query
        in: query
        required: true
        schema:
          type: string
          default: '*'
      - name: Page
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      - name: PageSize
        in: query
        schema:
          type: integer
          format: int32
          default: 25
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/IndicatorSearchResults'
            application/json:
              schema:
                $ref: '#/components/schemas/IndicatorSearchResults'
            text/json:
              schema:
                $ref: '#/components/schemas/IndicatorSearchResults'
        '429':
          description: If the user has sent too many requests
      summary: Get search
      x-summary-source: derived
      operationId: getSearch
      x-operation-id-source: derived
  /indicator/create:
    post:
      tags:
      - Indicator
      description: creates a new indicator.
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/IndicatorCreate'
          application/json:
            schema:
              $ref: '#/components/schemas/IndicatorCreate'
          text/json:
            schema:
              $ref: '#/components/schemas/IndicatorCreate'
          application/*+json:
            schema:
              $ref: '#/components/schemas/IndicatorCreate'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Indicator'
            application/json:
              schema:
                $ref: '#/components/schemas/Indicator'
            text/json:
              schema:
                $ref: '#/components/schemas/Indicator'
        '429':
          description: If the user has sent too many requests
      summary: Create indicator create
      x-summary-source: derived
      operationId: postIndicatorCreate
      x-operation-id-source: derived
  /indicator/update:
    put:
      tags:
      - Indicator
      description: updates one or more indicators.
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/BulkIndicatorUpdateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/BulkIndicatorUpdateRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/BulkIndicatorUpdateRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/BulkIndicatorUpdateRequest'
      responses:
        '200':
          description: OK
        '429':
          description: If the user has sent too many requests
      summary: Replace indicator update
      x-summary-source: derived
      operationId: putIndicatorUpdate
      x-operation-id-source: derived
components:
  schemas:
    CorrelationSet:
      type: object
      properties:
        calculation:
          $ref: '#/components/schemas/Calculation'
        maxDataPointOverlap:
          type: integer
          format: int32
        minDataPointOverlap:
          type: integer
          format: int32
        bestCorrelationCoefficient:
          type: number
          format: double
        bestRSquared:
          type: number
          format: double
        bestProcyclic:
          type: number
          format: double
        bestCountercyclic:
          type: number
          format: double
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Correlation'
      additionalProperties: false
    Seasonality:
      enum:
      - 0
      - 1
      - 999
      type: integer
      format: int32
    PeriodAlignment:
      enum:
      - 0
      - 1
      - 2
      type: integer
      format: int32
    Frequency:
      enum:
      - 0
      - 1
      - 2
      - 4
      - 12
      - 52
      - 365
      - 1000
      type: integer
      description: 'The frequency of the data.



        Daily: 365



        Weekly: 52



        Monthly: 12



        Quarterly: 4



        SemiAnnual: 2



        Annual: 1'
      format: int32
    CompositeMetadata:
      type: object
      properties:
        provider:
          type:
          - string
          - 'null'
          description: Unique identifier for provider
        providerId:
          type:
          - string
          - 'null'
          description: Indicator Identifier
        name:
          type:
          - string
          - 'null'
          description: Indicator Name
        description:
          type:
          - string
          - 'null'
          description: Indicator Description
        notes:
          type:
          - string
          - 'null'
          description: Indicator Notes
        units:
          type:
          - string
          - 'null'
          description: Indicator Units of measurement
        citation:
          type:
          - string
          - 'null'
          description: Indicator Citation
        path:
          type:
          - string
          - 'null'
          description: Path of indicator in Prevedere folder structure
        color:
          type:
          - string
          - 'null'
          description: Color code to be used in the Prevedere application
        aggregation:
          type:
          - string
          - 'null'
          description: Aggregation method used for indicator time series
        tags:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Tags assigned to help organize indicator
        industryCodes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/IndustryCode'
          description: Industry codes assigned to indicator
        classification:
          type:
          - string
          - 'null'
          description: Classification for indicator
        seasonalAdjustment:
          type:
          - string
          - 'null'
          description: Identifies if indicator is seasonally adjusted
        periodAlignment:
          type:
          - string
          - 'null'
          description: Identifies if time series aligns with the beginning or end of time period
        interval:
          type:
          - string
          - 'null'
          description: Name and multiple used to describe period length of indicator time series, similar to frequency
        frequency:
          type:
          - string
          - 'null'
          description: Frequency of indicator time series
        calculation:
          type:
          - string
          - 'null'
          description: Calculation of composite indicator
      additionalProperties: false
      description: This schema contains the metadata for the composite indicator
    IndicatorTransformation:
      type: object
      properties:
        provider:
          type:
          - string
          - 'null'
        providerId:
          type:
          - string
          - 'null'
        startDate:
          type:
          - string
          - 'null'
        endDate:
          type:
          - string
          - 'null'
        transformations:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Transformation'
        offset:
          type:
          - integer
          - 'null'
          format: int32
        isLogged:
          type: boolean
      additionalProperties: false
    AggregationMethod:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
      format: int32
    Point:
      type: object
      properties:
        value:
          type: number
          format: double
        date:
          type: string
          format: date-time
        annotation:
          type:
          - string
          - 'null'
        manuallyAdjusted:
          type: boolean
        isForecasted:
          type:
          - boolean
          - 'null'
      additionalProperties: false
    CompositeDefinition:
      type: object
      properties:
        entries:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CompositeIndicatorEntry'
          description: A list of indicators used in the composite formula.
        formula:
          type:
          - string
          - 'null'
          description: Formula for composite Indicator
        startDate:
          type:
          - string
          - 'null'
          description: Start Date of Composite Indicator
          format: date-time
        compositeMetadata:
          $ref: '#/components/schemas/CompositeMetadata'
      additionalProperties: false
      description: This schema contains the definition of a composite indicator. It includes the formula, start date and information for each indicator used in the formula.
    Transformation:
      type: object
      properties:
        order:
          type: integer
          format: int32
        required:
          type: boolean
      additionalProperties: false
    IndicatorCreate:
      type: object
      properties:
        indicator:
          $ref: '#/components/schemas/IndicatorCreateRequest'
      additionalProperties: false
    Correlation:
      type: object
      properties:
        counterCyclic:
          type: number
          format: double
        periodShift:
          type: integer
          format: int32
        proCyclic:
          type: number
          format: double
        correlationCoefficient:
          type: number
          format: double
        rSquared:
          type: number
          format: double
        numberOfDataPoints:
          type: integer
          format: int32
        notes:
          type:
          - string
          - 'null'
      additionalProperties: false
    ProviderAccess:
      enum:
      - 0
      - 1
      - 2
      type: integer
      format: int32
    IndicatorType:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      type: integer
      format: int32
    IndicatorCreateRequest:
      type: object
      properties:
        provider:
          type:
          - string
          - 'null'
          description: Unique identifier for provider
        providerId:
          type:
          - string
          - 'null'
          description: Indicator Identifier
        name:
          type:
          - string
          - 'null'
          description: Indicator Name
        description:
          type:
          - string
          - 'null'
          description: Indicator Description
        notes:
          type:
          - string
          - 'null'
          description: Indicator Notes
        units:
          type:
          - string
          - 'null'
          description: Indicator Units of measurement
        citation:
          type:
          - string
          - 'null'
          description: Indicator Citation
        path:
          type:
          - string
          - 'null'
          description: Path of indicator in Prevedere folder structure
        color:
          type:
          - string
          - 'null'
          description: Color code to be used in the Prevedere application
        aggregation:
          type:
          - string
          - 'null'
          description: Aggregation method used for indicator time series
        tags:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Tags assigned to help organize indicator
        industryCodes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/IndustryCode'
          description: Industry codes assigned to indicator
        classification:
          type:
          - string
          - 'null'
          description: Prevedere Classification for indicator
        seasonalAdjustment:
          type:
          - string
          - 'null'
          description: Identifies if indicator is seasonally adjusted
        periodAlignment:
          type:
          - string
          - 'null'
          description: Identifies if time series aligns with the beginning or end of time period
        interval:
          type:
          - string
          - 'null'
          description: Name and multiple used to describe period length of indicator the time series, similar to frequency
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RequestPoint'
          description: Data Time Series For Indicator
        calculation:
          type:
          - string
          - 'null'
        projectId:
          type:
          - string
          - 'null'
          description: Optional Project ID to associate the indicator with a specific project
      additionalProperties: false
    Calculation:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      type: integer
      description: 'The transformation applied to the data.



        Possible options:



        None 1



        PeriodOverPeriod 2



        YearOverYear 3



        ThreePeriodYearOverYear 6'
      format: int32
    CompositeDefinitionCreateRequest:
      type: object
      properties:
        entries:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CompositeEntryUpdateRequest'
          description: Indicator Entries that are used in the composite formula
        formula:
          type:
          - string
          - 'null'
          description: Formula for composite Indicator where each variable represents a CompositeIndicatorEntry
        startDate:
          type:
          - string
          - 'null'
          description: Optional Start Date of Composite, when blank the series will start on the first common date across variables
          format: date-time
        compositeMetadata:
          $ref: '#/components/schemas/CompositeMetadataCreateRequest'
      additionalProperties: false
      description: Request used to create a composite indicator
    IndustryCode:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        code:
          type:
          - string
          - 'null'
      additionalProperties: false
    CompositeDefinitionUpdateResponse:
      type: object
      properties:
        compositeDefinition:
          $ref: '#/components/schemas/CompositeDefinition'
        messages:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ResponseMessage'
      additionalProperties: false
    DisplayInformation:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: The display name to be used in the application. Limited to 50 characters.
        description:
          type:
          - string
          - 'null'
          description: The description to be shown in the application. Limited to 1,000 characters.
        color:
          type:
          - string
          - 'null'
          description: The color to use in the application. Must be a valid hex color code.
        category:
          type:
          - string
          - 'null'
          description: The category of the indicator. Limited to 1,000 characters.
      additionalProperties: false
    Indicator:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        aggregate:
          $ref: '#/components/schemas/AggregationMethod'
        calculation:
          $ref: '#/components/schemas/Calculation'
        color:
          type:
          - string
          - 'null'
        displayInformation:
          $ref: '#/components/schemas/DisplayInformation'
        count:
          type: integer
          format: int32
        created:
          type: string
          format: date-time
        startTime:
          type:
          - string
          - 'null'
          format: date-time
        endTime:
          type:
          - string
          - 'null'
          format: date-time
        transformedStartTime:
          type:
          - string
          - 'null'
          format: date-time
        transformedEndTime:
          type:
          - string
          - 'null'
