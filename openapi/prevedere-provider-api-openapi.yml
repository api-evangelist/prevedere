openapi: 3.0.1
info:
  title: Board Foresight API - V1 Alert Provider API
  description: ''
  version: v1
security:
- api key: []
tags:
- name: Provider
  description: ''
paths:
  /provider:
    get:
      tags:
      - Provider
      description: Retrieves complete list of providers with data in the system. A provider is an entity or organization that publishes indicator data
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Provider'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Provider'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Provider'
        '429':
          description: If the user has sent too many requests
components:
  schemas:
    Provider:
      type: object
      properties:
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        id:
          type: string
          format: uuid
        source:
          type: string
          nullable: true
      additionalProperties: false
  securitySchemes:
    api key:
      type: apiKey
      name: ApiKey
      in: query
