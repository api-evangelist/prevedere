      summary: Get model contribution by forecast model id
      x-summary-source: derived
      operationId: getModelContributionByForecastModelId
      x-operation-id-source: derived
  /model/modelhealth/{ForecastModelId}:
    post:
      tags:
      - ForecastModel
      summary: Checks model health for the given model id
      description: The forecast model id must be a locked model of the type segmented or multivariate
      parameters:
      - name: ForecastModelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ForecastModelHealth'
          application/json:
            schema:
              $ref: '#/components/schemas/ForecastModelHealth'
          text/json:
            schema:
              $ref: '#/components/schemas/ForecastModelHealth'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ForecastModelHealth'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ModelHealthResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ModelHealthResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ModelHealthResponse'
        '400':
          description: Bad Request
        '404':
          description: Not Found
        '422':
          description: Model is expired or in a non-production state
        '429':
          description: If the user has sent too many requests
      operationId: postModelModelhealthByForecastModelId
      x-operation-id-source: derived
