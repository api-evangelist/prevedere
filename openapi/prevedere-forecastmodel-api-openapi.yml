openapi: 3.2.0
info:
  title: Board Foresight API - V1 Forecast Model API
  description: ''
  version: v1
security:
- api key: []
tags:
- name: ForecastModel
  description: ''
paths:
  /backtest:
    get:
      tags:
      - ForecastModel
      description: Performs a backtest on the supplied model id
      parameters:
      - name: ForecastModelId
        in: query
        schema:
          type: string
          format: uuid
      - name: AsOfDate
        in: query
        schema:
          type: string
          format: date-time
      - name: TargetHorizon
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '410':
          description: Gone
        '429':
          description: If the user has sent too many requests
      deprecated: true
      summary: Get backtest
      x-summary-source: derived
      operationId: getBacktest
      x-operation-id-source: derived
  /forecastmodel/{ForecastModelId}:
    get:
      tags:
      - ForecastModel
      summary: Retrieves information for a single model given the ID
      description: 'This endpoint is used to pull information about an individual model accessible to the API key.


        The response includes model metadata, information about the dependent variable or Primary Indicator and independent or Explanatory Indicators including offsets and display values.'
      parameters:
      - name: ForecastModelId
        in: path
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastModelInfo'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseMessage'
        '422':
          description: Model is expired or in a non-production state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseMessage'
        '429':
          description: If the user has sent too many requests
      operationId: getForecastmodelByForecastModelId
      x-operation-id-source: derived
  /forecastmodels:
    get:
      tags:
      - ForecastModel
      summary: Retrieves the list of accessible forecast models for the user
      parameters:
      - name: tags
        in: query
        description: Provide of list of tags to filter by. Only models with at least one of the provided tags will be returned
        schema:
          type: array
          items:
            type: string
      - name: states
        in: query
        description: "Provide a list of states to filter by. Only models with one of the provided states will be returned. \n            Hold CTRL or Command key to select multiple model states\n            \n\n            0 = Draft\n            \n\n            1 = Archive\n            \n\n            2 = Production"
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ModelState'
      - name: generateSummary
        in: query
        description: If true, generates a brief summary of each model. This will increase the time for a response by 7 seconds per model.
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ForecastModelInfo'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ForecastModelInfo'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ForecastModelInfo'
        '429':
          description: If the user has sent too many requests
      operationId: getForecastmodels
      x-operation-id-source: derived
  /rawmodel/{ForecastModelId}:
    get:
      tags:
      - ForecastModel
      description: Retrieves the component data of a forecast model
      parameters:
      - name: ForecastModelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: UseForecastFrequency
        in: query
        schema:
          type: boolean
      - name: ExcludeIndicators
        in: query
        schema:
          type: boolean
      - name: AsOfDate
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ForecastModelComponentInfo'
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastModelComponentInfo'
            text/json:
              schema:
                $ref: '#/components/schemas/ForecastModelComponentInfo'
        '429':
          description: If the user has sent too many requests
        '422':
          description: Model is expired or in a non-production state
      summary: Get rawmodel by forecast model id
      x-summary-source: derived
      operationId: getRawmodelByForecastModelId
      x-operation-id-source: derived
  /rawmodel/{ForecastModelId}/{UseForecastFrequency}:
    get:
      tags:
      - ForecastModel
      description: Retrieves the component data of a forecast model
      parameters:
      - name: ForecastModelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: UseForecastFrequency
        in: path
        required: true
        schema:
          type: boolean
      - name: ExcludeIndicators
        in: query
        schema:
          type: boolean
      - name: AsOfDate
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ForecastModelComponentInfo'
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastModelComponentInfo'
            text/json:
              schema:
                $ref: '#/components/schemas/ForecastModelComponentInfo'
        '429':
          description: If the user has sent too many requests
        '422':
          description: Model is expired or in a non-production state
      summary: Get rawmodel by forecast model id by use forecast frequency
      x-summary-source: derived
      operationId: getRawmodelByForecastModelIdByUseForecastFrequency
      x-operation-id-source: derived
  /model/summary/{ForecastModelId}:
    get:
      tags:
      - ForecastModel
      description: Retrieves the model commentary summary for a forecast model
      parameters:
      - name: ForecastModelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
