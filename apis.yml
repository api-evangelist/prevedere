- aid: prevedere:prevedere-workbench-api
  name: Prevedere Workbench API
  description: >-
    Workbenches are a powerful feature in the Board Foresight application that allow users to organize
    and analyze data through indicators. They enable the creation of models by selecting primary and additional
    indicators, which can be further adjusted and managed.


    Using Workbenches endpoints you can

    - Retrieve the workbench information for the given workbench ID

    - Update or add an indicator to the existing workbench specified by the given ID

    - Retrieve the workbench series information for the given workbench ID and categories

    - Retrieves the list of accessible workbenches for the company
  humanURL: https://api.prevedere.com/docs/
  baseURL: https://api.prevedere.com
